services:
  - type: web
    name: mod-django
    env: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn MOD.wsgi:application"
    plan: free
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: False
      - key: DATABASE_URL
        fromDatabase:
          name: mod-db
          property: connectionString

databases:
  - name: mod-db
    plan: free
